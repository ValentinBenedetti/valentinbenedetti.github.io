<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outside · Valentin Benedetti</title>
  <link rel="icon" href="assets/rings.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main>
    <h1 class="page-title">Outside</h1>
    <p class="subtitle">Some mountains I had the pleasure to meet</p>

    <div class="gallery">
      <figure class="shot">
        <img src="assets/outside/tre-cime.jpg" alt="Tre Cime di Lavaredo at dusk" loading="lazy">
        <figcaption><span class="pin">●</span> Tre Cime di Lavaredo <span class="where">Dolomites, Italy</span></figcaption>
      </figure>
      <figure class="shot">
        <img src="assets/outside/cadini.jpg" alt="Cadini di Misurina peaks" loading="lazy">
        <figcaption><span class="pin">●</span> Cadini di Misurina <span class="where">Dolomites, Italy</span></figcaption>
      </figure>
      <figure class="shot">
        <img src="assets/outside/mont-blanc.jpg" alt="Mont Blanc massif seen from Chamonix" loading="lazy">
        <figcaption><span class="pin">●</span> Mont Blanc <span class="where">Chamonix, France</span></figcaption>
      </figure>
      <figure class="shot">
        <img src="assets/outside/maroon-bells.jpg" alt="Maroon Bells above Crater Lake" loading="lazy">
        <figcaption><span class="pin">●</span> Maroon Bells <span class="where">Aspen, Colorado, USA</span></figcaption>
      </figure>
      <figure class="shot">
        <img src="assets/outside/tronador.jpg" alt="Cerro Tronador and its glacier" loading="lazy">
        <figcaption><span class="pin">●</span> Cerro Tronador <span class="where">Bariloche, Argentina</span></figcaption>
      </figure>
    </div>
  </main>
  <script src="assets/nav.js"></script>
</body>
</html>
